databaseChangeLog:
  - changeSet:
      id: 6
      author: com.taskmanagement
      changes:
        - createTable:
            tableName: attachments
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: task_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_attachments_task
                    references: tasks(id)
              - column:
                  name: dropbox_file_id
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: filename
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: upload_date
                  type: datetime
                  constraints:
                    nullable: false
