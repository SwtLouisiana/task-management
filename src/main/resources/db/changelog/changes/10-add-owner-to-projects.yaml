databaseChangeLog:
  - changeSet:
      id: 10
      author: com.taskmanagement
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "0"
            sql: SELECT COUNT(*) FROM projects
      changes:
        - addColumn:
            tableName: projects
            columns:
              - column:
                  name: owner_id
                  type: bigint
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: projects
            baseColumnNames: owner_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_projects_owner
